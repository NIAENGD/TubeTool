<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TubeTool</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="app-header">
      <div class="brand-wrap">
        <h1>TubeTool</h1>
        <p class="subtitle">Fast playlist/video downloads with better controls</p>
      </div>
      <nav class="top-nav">
        <button id="homeNavButton" class="ghost">Home</button>
        <button id="downloadsButton" class="ghost">Downloads</button>
        <button id="settingsButton" class="ghost">Settings</button>
      </nav>
    </header>

    <main>
      <section id="analyzeView" class="card">
        <h2>Analyze URL</h2>
        <p>Paste a YouTube video or playlist URL.</p>
        <div class="row">
          <input id="urlInput" type="url" placeholder="https://www.youtube.com/watch?v=..." />
          <button id="processButton">Analyze</button>
        </div>
        <p id="analyzeStatus" class="status"></p>
      </section>

      <section id="selectionView" class="card hidden">
        <div class="title-row">
          <h2>Select Formats</h2>
          <span id="titleLabel" class="pill">Untitled</span>
        </div>

        <div class="column">
          <div class="category">
            <label class="bold"><input type="checkbox" id="audioAll" /> Select all audio formats</label>
            <div id="audioList"></div>
          </div>
          <div class="category">
            <label class="bold"><input type="checkbox" id="videoAll" /> Select all video formats</label>
            <div id="videoList"></div>
          </div>
        </div>

        <div class="resolution">
          <label for="resolutionRange">Max Resolution</label>
          <input type="range" id="resolutionRange" min="144" max="2160" step="1" value="1080" />
          <output id="resolutionValue">1080p</output>
        </div>

        <div class="row end">
          <button id="backButton" class="ghost">Back</button>
          <button id="downloadButton">Download Selected</button>
        </div>
      </section>

      <section id="downloadsView" class="card hidden">
        <div class="title-row">
          <h2>Download Queue</h2>
          <button id="downloadsBackButton" class="ghost">Back</button>
        </div>
        <div id="downloadsList"></div>
      </section>

      <section id="settingsView" class="card hidden">
        <div class="title-row">
          <h2>Settings</h2>
          <button id="settingsSaveButton">Save</button>
        </div>

        <div class="settings-grid">
          <label>
            Output Folder
            <input id="outputDirInput" type="text" placeholder="/Users/me/Downloads/TubeTool" />
          </label>

          <label>
            Python Binary (optional)
            <input id="pythonPathInput" type="text" placeholder="python3" />
          </label>

          <label>
            Default Max Resolution
            <input id="defaultResolutionInput" type="number" min="144" max="4320" step="1" />
          </label>

          <label class="toggle-row">
            <input id="autoOpenToggle" type="checkbox" />
            Open downloaded file location automatically
          </label>
        </div>

        <p id="settingsStatus" class="status"></p>
      </section>
    </main>

    <script src="renderer.js"></script>
  </body>
</html>
